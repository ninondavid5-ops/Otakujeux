<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OTAKUJEUX — Renaissance</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;color:#fff;font-family:system-ui,Arial}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:10px}.box{background:#07101bdd;border:1px solid #71809c;border-radius:14px;padding:9px 12px;backdrop-filter:blur(6px)}.left{width:280px}.right{width:310px;text-align:right}.title{font-weight:900}.bar{height:8px;background:#252b38;border-radius:8px;margin-top:4px;overflow:hidden}.hp{height:100%;background:#e85d70}.xp{height:100%;background:#8b6cff}.small{font-size:12px;color:#bec8da}
#message{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);display:none;max-width:90%;text-align:center}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#314979,#060a10 72%)}.introbox{max-width:720px;padding:28px}.introbox h1{font-size:clamp(42px,10vw,86px);margin:0;letter-spacing:-3px}.accent{color:#a98bff}.introbox p{line-height:1.6;color:#c7d0e2}.start{cursor:pointer;background:#8d6cff;color:#fff;border:0;border-radius:12px;padding:16px 26px;font-size:18px;font-weight:900;box-shadow:0 8px 30px #0008}
#dialog{display:none;position:fixed;left:4%;right:4%;bottom:20px;z-index:15}.choice{margin:8px 6px 0 0;padding:9px 13px;border-radius:9px;border:1px solid #7568b8;background:#282246;color:#fff}
#touch{position:fixed;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;pointer-events:none}.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:3px;pointer-events:auto}.dpad button,.acts button{background:#111827e8;color:#fff;border:1px solid #687594;border-radius:12px;font-weight:900}.up{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.acts{display:flex;gap:7px;align-items:end;pointer-events:auto}.acts button{width:60px;height:60px}.atk{border-color:#b178ff!important}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="top"><div id="stats" class="box left"></div><div id="quest" class="box right"></div></div></div>
<div id="message" class="box"></div>
<div id="dialog" class="box"><b id="speaker" class="accent"></b><div id="dialogText"></div><div id="choices"></div></div>
<div id="touch"><div class="dpad"><button class="up" data-key="w">▲</button><button class="l" data-key="a">◀</button><button class="d" data-key="s">▼</button><button class="r" data-key="d">▶</button></div><div class="acts"><button data-act="interact">PARLER</button><button data-act="potion">POTION</button><button class="atk" data-act="attack">ATTAQUE</button></div></div>
<div id="intro"><div class="introbox"><h1>OTAKU<span class="accent">JEUX</span></h1><h2>RENAISSANCE · MONDE 3D</h2><p>Cette version utilise maintenant de vrais modèles 3D texturés pour les personnages et le décor. Tu es Aren. Retrouve Lyra, découvre le village et commence ton aventure.</p><p id="loadStatus" class="small">Chargement du monde 3D…</p><p class="small">WASD / flèches · ESPACE : attaque · E : parler · P : potion</p><button id="start" class="start" disabled>CHARGEMENT…</button></div></div>
<script>
(function(){
  const status=document.getElementById('loadStatus');
  const start=document.getElementById('start');
  const sources=[
    [
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
      'https://unpkg.com/three@0.160.0/build/three.min.js','https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.min.js'
    ],
    [
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js',
      'https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js','https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/js/loaders/GLTFLoader.js'
    ],
    [
      'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.1/lib/three-vrm.min.js',
      'https://unpkg.com/@pixiv/three-vrm@2.0.1/lib/three-vrm.min.js','https://raw.githubusercontent.com/pixiv/three-vrm/2.0.1/lib/three-vrm.min.js'
    ]
  ];
  function loadOne(urls,i){
    return new Promise((resolve,reject)=>{
      let n=0;
      function attempt(){
        if(n>=urls.length)return reject(new Error('dependency '+i));
        const s=document.createElement('script');
        s.src=urls[n++];
        s.onload=()=>resolve();
        s.onerror=()=>{s.remove();attempt()};
        document.head.appendChild(s);
      }
      attempt();
    });
  }
  (async()=>{
    try{
      status.textContent='Chargement du moteur 3D…';
      for(let i=0;i<sources.length;i++){
        status.textContent='Chargement 3D '+(i+1)+'/3…';
        await loadOne(sources[i],i);
      }
      status.textContent='Préparation du monde…';
      const s=document.createElement('script');
      s.src='game.js?v=2';
      s.onload=()=>{ if(start){start.disabled=false;start.textContent='ENTRER DANS LE MONDE'} };
      s.onerror=()=>{status.textContent='Le jeu n’a pas pu démarrer. Recharge la page.'};
      document.body.appendChild(s);
    }catch(e){
      status.textContent='Connexion au moteur 3D impossible. Une seconde tentative est disponible en rechargeant la page.';
    }
  })();
})();
</script>
</body>
</html>
